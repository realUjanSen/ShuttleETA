name: Build and Release APK

# Every push (any branch or tag) builds the APK and publishes a release with it.
# Tag pushes such as v1.0.0 publish a normal release; other pushes publish a dev-<commit> prerelease.
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to release, for example v1.0.0"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version and release type
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"; KIND=tag
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"; KIND=tag
          else
            TAG="dev-$(git rev-parse --short HEAD)"; KIND=dev
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Building $TAG ($KIND)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionName="$TAG" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Name the APK and verify its signature
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Gradle signs the release build with the committed release key.
          cp app/build/outputs/apk/release/app-release.apk "ShuttleETA-${TAG}.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --verbose "ShuttleETA-${TAG}.apk"

      - name: Put the APK in a zip
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          zip -j "ShuttleETA-${TAG}.zip" "ShuttleETA-${TAG}.apk"

      - name: Extract the APK from the zip
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          rm -f "ShuttleETA-${TAG}.apk"
          mkdir -p release-out
          unzip -o "ShuttleETA-${TAG}.zip" -d release-out
          ls -l release-out

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShuttleETA-${{ steps.tag.outputs.tag }}
          path: ShuttleETA-${{ steps.tag.outputs.tag }}.zip

      - name: Create or update the GitHub release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KIND: ${{ steps.tag.outputs.kind }}
          SHA: ${{ github.sha }}
        run: |
          APK="release-out/ShuttleETA-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          elif [ "$KIND" = "tag" ]; then
            gh release create "$TAG" "$APK" --title "Shuttle ETA $TAG" --generate-notes --verify-tag
          else
            gh release create "$TAG" "$APK" --target "$SHA" --prerelease \
              --title "Dev build $TAG" --notes "Automatic build of commit $SHA"
          fi
